[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flow-observation"
version = "0.1.0"
description = "Differentiable projected Lagrangian trajectory observations for 3D flow fields"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
test = ["pytest>=8"]
lbm3d = [
    "taichi>=1.7,<2",
    "pyevtk>=1.6",
    "sympy>=1.12",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
